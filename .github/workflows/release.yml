name: Publish Codexa

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Tag version: ${TAG_VERSION}"
          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run lint
        run: npm run lint

      - name: Build landing site
        working-directory: landing
        run: |
          npm ci
          npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package
        run: |
          if npm view "codexa-toolkit@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Package version already published; continuing with release verification."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for npm registry to index codexa-toolkit@${VERSION}..."
          # Give registry a moment to propagate
          sleep 10
          mkdir -p /tmp/verify-release
          cd /tmp/verify-release
          npm init -y
          npm install codexa-toolkit@${VERSION}
          npx codexa --version | grep "${VERSION}"
          npx codexa --help
          git init
          mkdir -p src
          printf 'export const answer = 42;\n' > src/index.js
          git add src/index.js
          git -c user.name='Codexa Release' -c user.email='release@example.test' commit -m 'initial fixture'
          npx codexa init
          printf 'export const answer = missingValue;\n' > src/index.js
          set +e
          npx codexa check --ci --all-files > release-check.json
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          node -e "const r=require('./release-check.json'); if(r.result !== 'blocked' || r.summary.filesChecked < 1) process.exit(1)"

      - name: Generate Homebrew formula for the published tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl --fail --location --silent --show-error "$URL" | sha256sum | cut -d ' ' -f 1)
          test -n "$SHA256"
          sed -E \
            -e "s|archive/refs/tags/v[0-9.]+\\.tar\\.gz|archive/refs/tags/v${VERSION}.tar.gz|" \
            -e "s|sha256 \"[0-9a-f]+\"|sha256 \"${SHA256}\"|" \
            -e "s|assert_match \"[0-9.]+\"|assert_match \"${VERSION}\"|" \
            Formula/codexa.rb > "codexa-${VERSION}.rb"

      - name: Upload Homebrew formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: codexa-*.rb
