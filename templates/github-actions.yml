name: Codexa Code Quality

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  codexa:
    runs-on: ubuntu-latest
    name: Code Quality Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Codexa
        run: npm install -g codexa-toolkit@1.1.3

      - name: Read Codexa configuration
        id: config
        run: |
          POST_PR_COMMENT=$(node -e "const fs=require('fs'); const p='codexa.config.json'; const c=fs.existsSync(p) ? JSON.parse(fs.readFileSync(p)) : {}; process.stdout.write(String(c.ci?.postPRComment ?? true))")
          echo "post_pr_comment=$POST_PR_COMMENT" >> "$GITHUB_OUTPUT"

      - name: Install Python linters
        run: pip install ruff
        continue-on-error: true

      - name: Run Codexa check
        id: codexa
        run: |
          BASE_BRANCH="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}"
          set +e
          codexa check --ci --base "$BASE_BRANCH" --all-files --output json > codexa-result.json 2> codexa-error.log
          CODEXA_EXIT=$?
          set -e
          cat codexa-result.json
          if [ -s codexa-error.log ]; then cat codexa-error.log >&2; fi
          echo "exit_code=$CODEXA_EXIT" >> "$GITHUB_OUTPUT"

      - name: Parse results
        id: parse
        run: |
          if [ ! -s codexa-result.json ]; then
            echo "::error::Codexa output is empty."
            exit 1
          fi

          # Validate JSON structure
          if ! jq empty codexa-result.json >/dev/null 2>&1; then
            echo "::error::Codexa produced invalid JSON output."
            exit 1
          fi

          # Check for runtime error field
          HAS_ERROR=$(jq 'has("error")' codexa-result.json)
          if [ "$HAS_ERROR" = "true" ]; then
            ERR_MSG=$(jq -r '.error // "Unknown error"' codexa-result.json)
            echo "::error::Codexa runtime failure: $ERR_MSG"
            exit 1
          fi

          RESULT=$(jq -r '.result // empty' codexa-result.json)
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Codexa output is missing .result field."
            exit 1
          fi

          BLOCKING=$(jq '.summary.blocking // 0' codexa-result.json)
          WARNINGS=$(jq '.summary.warnings // 0' codexa-result.json)
          FILES=$(jq '.summary.filesChecked // 0' codexa-result.json)
          ENFORCE=$(jq -r 'if has("enforceOnCI") then .enforceOnCI else true end' codexa-result.json)

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          echo "warnings=$WARNINGS" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "enforce_on_ci=$ENFORCE" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request' && steps.config.outputs.post_pr_comment == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('codexa-result.json', 'utf8'));

            let icon = '✅';
            if (result.result === 'blocked') {
              icon = '❌';
            } else if (result.result === 'warned') {
              icon = '⚠️';
            }

            let comment = `## ${icon} Codexa Code Quality\n\n`;
            comment += `**Result:** ${result.result.toUpperCase()}\n`;
            comment += `**Blocking errors:** ${result.summary.blocking}\n`;
            comment += `**Warnings:** ${result.summary.warnings}\n`;
            comment += `**Files checked:** ${result.summary.filesChecked}\n\n`;

            if (result.blocking.length > 0) {
              comment += `### 🔴 Blocking Errors\n`;
              for (const err of result.blocking.slice(0, 10)) {
                comment += `- \`${err.file}:${err.line}\` — ${err.rule}: ${err.message}\n`;
              }
              if (result.blocking.length > 10) {
                comment += `- ... and ${result.blocking.length - 10} more\n`;
              }
              comment += '\n';
            }

            if (result.warnings.length > 0) {
              comment += `### 🟡 Warnings\n`;
              for (const err of result.warnings.slice(0, 5)) {
                comment += `- \`${err.file}:${err.line}\` — ${err.rule}\n`;
              }
              if (result.warnings.length > 5) {
                comment += `- ... and ${result.warnings.length - 5} more\n`;
              }
            }

            comment += `\n---\nGenerated by [Codexa](https://github.com/sayam-1705/codexa)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if blocked or error
        if: steps.codexa.outputs.exit_code != '0' && steps.parse.outputs.enforce_on_ci != 'false'
        run: |
          echo "Codexa check failed with exit code ${{ steps.codexa.outputs.exit_code }}."
          exit ${{ steps.codexa.outputs.exit_code }}
